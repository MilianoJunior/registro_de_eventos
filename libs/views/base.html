<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Dashboard de Ocorrências</title>
  <!-- Tailwind compilado offline -->
   <!-- <link rel="stylesheet" href="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"> -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/engegom.ico') }}">
  <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-sans">
    <div class="flex h-screen bg-background">
        {% include 'components/_sidebar.html' %}
        <div class="flex-1 overflow-y-auto">
            {% block content %}
            {% endblock %}
        </div>
    </div>
    <!-- importar socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        window.socket = socket;
        // Log de conexão
        socket.on('connect', () => {
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('🔌 SOCKET.IO CONECTADO');
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('   Socket ID:', socket.id);
            console.log('   Status: ✅ Pronto para testar leituras');
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
        });
        
        socket.on('disconnect', () => {
            console.warn('⚠️ Socket.IO desconectado');
        });
        
        socket.on('connect_error', (error) => {
            console.error('❌ Erro ao conectar Socket.IO:', error);
        });
        
        socket.on('file_changed', (data) => {
            console.log('Arquivo modificado:', data.path);
            location.reload();
        });

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) { // Garante que o elemento existe antes de adicionar o listener
            themeToggle.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</body>
</html>
