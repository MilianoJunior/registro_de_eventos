<!DOCTYPE html>
<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - EngeSEP O&amp;M</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#020617",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">
<div class="fixed top-6 right-6">
<button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all" type="button">
<span class="material-icons-outlined block dark:hidden">dark_mode</span>
<span class="material-icons-outlined hidden dark:block text-yellow-400">light_mode</span>
</button>
</div>
<main class="w-full max-w-md">
<div class="text-center mb-8">
<div class="flex items-center justify-center gap-2 mb-2">
<div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
<span class="material-icons-outlined text-white text-2xl">bolt</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                    EngeSEP <span class="text-primary font-medium">O&amp;M</span>
</h1>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm">Sistema de registro de eventos para usinas</p>
</div>
<div class="login-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl p-8">
<h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-6">Acesse sua conta</h2>
{% if error %}
<div class="mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-4 py-2">
{{ error }}
</div>
{% endif %}
<form action="/login" class="space-y-5" method="POST" autocomplete="on">
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1" for="identifier">Usuário ou E-mail</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-icons-outlined text-xl">person</span>
</div>
<input class="block w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="identifier" name="identifier" placeholder="ex: joao.silva" required="" type="text" autocomplete="username" value="{{ identifier }}"/>
</div>
</div>
<!-- <div class="space-y-1.5">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Senha</label>
<a class="text-xs text-primary hover:underline font-medium" href="#">Esqueceu a senha?</a>
</div> -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-icons-outlined text-xl">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password" autocomplete="current-password"/>
<button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-primary transition-colors">
<span class="material-icons-outlined text-xl" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-2 ml-1">
<input class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-primary focus:ring-primary focus:ring-offset-0 dark:focus:ring-offset-slate-900" id="remember" name="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400 select-none" for="remember">Lembrar neste dispositivo</label>
</div>
<button class="w-full bg-primary hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>Entrar no Sistema</span>
<span class="material-icons-outlined text-lg">login</span>
</button>
</form>
</div>
<div class="mt-8 text-center">
<p class="text-sm text-slate-500 dark:text-slate-500">
                Acesso restrito a colaboradores autorizados.
            </p>
</div>
</main>
<footer class="mt-auto py-8 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600 font-medium">
            © 2025 EngeSEP Systems • Todos os direitos reservados
        </p>
</footer>
<script>
        // Persistir tema entre login e sistema
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) {
            document.documentElement.classList.toggle('dark', storedTheme === 'dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        const toggleBtn = document.getElementById('toggle-password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const input = document.getElementById('password');
                const icon = document.getElementById('toggle-password-icon');
                if (!input || !icon) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.textContent = isPassword ? 'visibility_off' : 'visibility';
            });
        }
    </script>

</body></html>
