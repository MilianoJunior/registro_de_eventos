{% extends "base.html" %}
{% set active_page = "home" %}
{% block title %}Temperaturas — EngeSEP O&M{% endblock %}

{% block content %}
<!-- Assegura que o CSS do card esteja carregado -->
<link rel="stylesheet" href="/static/css/card.css">

<div class="p-6 space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-lg font-medium text-text-primary">Temperaturas</h1>
        <a href="{{ url_for('index') }}"
            class="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-text-primary hover:bg-background-alt transition">
            Voltar
        </a>
    </div>

    <!-- Container Grid com dados iniciais -->
    <div class="temp-grid-container" data-temperaturas='{{ temperaturas | tojson | safe }}'>
        {% for temperatura in temperaturas %}
        {% include "components/_new_card.html" %}
        {% endfor %}
    </div>
</div>

<!-- TEMPLATES PARA JS (Hydration) -->
<template id="template-card-temperatura">
    <!-- Dummy object for Jinja rendering calls inside JS cloning -->
    {% set temperatura = {'nome': '', 'historico': {}, 'atual': 0, 'alarme': 0, 'trip': 0, 'risco': 0} %}
    {% include "components/_new_card.html" %}
</template>

<template id="template-card-temperatura-bar">
    <div class="new-temp-bar-wrapper">
        <div class="new-temp-bar" style="opacity: 0.2; position: absolute; bottom: 0; width: 100%;"></div>
        <div class="new-temp-bar main-bar" style="z-index: 1;"></div>
    </div>
</template>

<!-- Script Consolidado -->
<script src="/static/js/status_usinas.js"></script>
{% endblock %}
