<div
    class="w-full bg-surface border border-slate-200 dark:border-slate-800 rounded-xl shadow-lg overflow-hidden transition-colors duration-300 flex flex-col h-full relative">

    <!-- 1. Header Principal (Título + Status) -->
    <header
        class="px-5 py-3 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 flex-none bg-slate-50/50 dark:bg-slate-900/20 z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-green-500/20 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-green-500 fill-1 text-base">water_drop</span>
            </div>
            <h1 class="text-base font-bold text-slate-900 dark:text-white tracking-tight">{{ usina.nome }}</h1>
        </div>
        <div class="flex gap-2">
            <div class="flex items-center gap-1.5 bg-green-500/10 border border-green-500/20 px-2.5 py-1 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[9px] font-bold text-green-500 tracking-wider uppercase">UG-01 ON</span>
            </div>
            <div class="flex items-center gap-1.5 bg-green-500/10 border border-green-500/20 px-2.5 py-1 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[9px] font-bold text-green-500 tracking-wider uppercase">UG-02 ON</span>
            </div>
        </div>
    </header>

    <!-- 2. Painel de Dados Compacto (Topo sobre o gráfico ou logo abaixo do header) -->
    <div
        class="flex-none p-4 grid grid-cols-12 gap-4 border-b border-slate-200 dark:border-slate-800 z-10 bg-surface relative shadow-sm">
        <!-- Potência (Maior destaque) -->
        <div class="col-span-5 flex flex-col justify-center border-r border-slate-100 dark:border-slate-800 pr-4">
            <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1">Total
                Power</p>
            <div class="flex items-baseline gap-1.5">
                <span class="scada-number text-4xl font-bold text-green-500 tracking-tight">1240.8</span>
                <span class="text-sm font-bold text-green-500 opacity-60">MW</span>
            </div>
            <div class="flex gap-4 mt-2">
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">UG1: <b
                            class="text-slate-700 dark:text-slate-200">900.0</b></span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500/50"></span>
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">UG2: <b
                            class="text-slate-700 dark:text-slate-200">340.8</b></span>
                </div>
            </div>
        </div>

        <!-- Níveis (Compacto a direita) -->
        <div class="col-span-7 flex flex-col justify-center pl-2">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <p class="text-[9px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-0.5">
                        Montante</p>
                    <div class="flex items-baseline gap-1">
                        <span class="scada-number text-2xl font-bold text-cyan-500 dark:text-cyan-400">934.32</span>
                        <span class="text-[10px] font-bold text-cyan-500 dark:text-cyan-400 opacity-60">m</span>
                    </div>
                </div>

                <div class="text-right">
                    <p class="text-[9px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-0.5">
                        Jusante</p>
                    <div class="flex items-baseline justify-end gap-1">
                        <span class="scada-number text-2xl font-bold text-blue-500 dark:text-blue-400">933.62</span>
                        <span class="text-[10px] font-bold text-blue-500 dark:text-blue-400 opacity-60">m</span>
                    </div>
                </div>
            </div>
            <!-- Barra Nível -->
            <div class="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden flex relative">
                <div class="h-full bg-cyan-500 w-[70%]"></div>
                <div class="h-full bg-blue-500 w-[15%]"></div>
                <!-- Marker Queda -->
                <div
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[8px] font-bold text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-900 px-1 rounded-full border border-slate-200 dark:border-slate-800 shadow-sm">
                    0.70m
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Gráfico (Grande Destaque - Ocupa restante) -->
    <div class="relative flex-grow min-h-[250px] w-full bg-slate-50/30 dark:bg-slate-900/10 group">
        <!-- Legenda Flutuante -->
        <div class="absolute top-3 right-5 z-10 flex gap-4 opacity-50 group-hover:opacity-100 transition-opacity">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
                <span class="text-[9px] font-bold text-slate-500 dark:text-slate-400">MONT</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span class="text-[9px] font-bold text-slate-500 dark:text-slate-400">PWR</span>
            </div>
        </div>

        <svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 1000 300">
            <!-- Grid Lines Sutis -->
            <line x1="0" y1="75" x2="1000" y2="75" stroke="currentColor" class="text-slate-200 dark:text-slate-800"
                stroke-width="0.5" stroke-dasharray="4,4"></line>
            <line x1="0" y1="150" x2="1000" y2="150" stroke="currentColor" class="text-slate-200 dark:text-slate-800"
                stroke-width="0.5" stroke-dasharray="4,4"></line>
            <line x1="0" y1="225" x2="1000" y2="225" stroke="currentColor" class="text-slate-200 dark:text-slate-800"
                stroke-width="0.5" stroke-dasharray="4,4"></line>

            <!-- Chart Lines (Aumentada amplitude y 50-250) -->
            <path d="M0,250 Q150,260 300,270 T600,250 T1000,280" fill="none" stroke="#3b82f6" stroke-dasharray="4,4"
                stroke-width="2" opacity="0.4"></path>

            <path class="chart-glow-cyan" d="M0,200 Q200,180 400,210 T700,200 T1000,230" fill="none" stroke="#06b6d4"
                stroke-width="3"></path>

            <!-- Power Area -->
            <defs>
                <linearGradient id="powerGradient" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
                </linearGradient>
            </defs>
            <path fill="url(#powerGradient)" d="M0,150 Q150,170 300,120 T550,180 T800,90 T1000,80 L1000,300 L0,300 Z"
                class="fill-green-500/10 dark:fill-green-500/5"></path>
            <path class="chart-glow" d="M0,150 Q150,170 300,120 T550,180 T800,90 T1000,80" fill="none" stroke="#22c55e"
                stroke-linecap="round" stroke-width="4"></path>
        </svg>

        <!-- Labels Eixo X -->
        <div
            class="absolute bottom-1 left-0 right-0 flex justify-between px-4 text-[9px] text-slate-400 font-mono opacity-60">
            <span>00:00</span>
            <span>06:00</span>
            <span>12:00</span>
            <span>18:00</span>
            <span>23:59</span>
        </div>
    </div>

    <!-- 4. Footer Informações Técnicas -->
    <footer
        class="px-5 py-2.5 bg-slate-100/50 dark:bg-slate-950/30 flex justify-between items-center text-[10px] text-slate-500 dark:text-slate-400 flex-none border-t border-slate-200 dark:border-slate-800 z-20">
        <div class="flex gap-4">
            <span class="flex items-center gap-1.5"><span
                    class="material-symbols-outlined text-[14px]">thermostat</span> Temp: <b
                    class="text-slate-900 dark:text-white">42°C</b></span>
            <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">speed</span>
                Speed: <b class="text-slate-900 dark:text-white">180</b></span>
        </div>
        <div class="flex gap-4 font-mono">
            <span>G1: <b class="text-slate-900 dark:text-white">0.15m</b></span>
            <span>G2: <b class="text-slate-900 dark:text-white">0.22m</b></span>
        </div>
    </footer>
</div>
