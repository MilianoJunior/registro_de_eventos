{% macro card(title, value, unit='', text_color_class='', value_id='', extra_classes='', attributes='') %}
<div class="bg-surface p-4 rounded-lg border border-slate-200 dark:border-slate-800 {{ extra_classes }}" {{
    attributes|safe }}>
    <p class="text-xs text-text-muted uppercase tracking-wide mb-1">{{ title }}</p>
    <p class="text-2xl font-medium text-text-primary {{ text_color_class }}">
        <span {% if value_id %}id="{{ value_id }}" {% endif %}>{{ value }}</span>
        {% if unit %}<span class="text-sm">{{ unit }}</span>{% endif %}
    </p>
    {% if caller %}
    {{ caller() }}
    {% endif %}
</div>
{% endmacro %}
